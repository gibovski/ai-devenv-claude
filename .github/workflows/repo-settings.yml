# Applies infra/terraform/github (branch protection) when GH_ADMIN_TOKEN is configured.
name: repo-settings
on:
  push:
    branches: [main]
    paths: ["infra/terraform/github/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: apply
        working-directory: infra/terraform/github
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::notice::GH_ADMIN_TOKEN not set; skipping. Add a fine-grained token with Administration: write to apply."
            exit 0
          fi
          terraform init -input=false
          terraform import -input=false github_branch_protection.main "${{ github.event.repository.name }}:main" || true
          terraform apply -auto-approve -input=false
