# Tests the control plane and web UI, builds the stack images, and pushes them to GHCR from main.
name: stack
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: control plane tests
        working-directory: services/control-plane
        run: uv run --frozen pytest -q && uv run --frozen pytest -q ../../workers/agent
      - name: OpenAPI document is up to date
        working-directory: services/control-plane
        run: |
          uv run --frozen python -m devenv.openapi > /tmp/openapi.json
          diff -u ../../docs/controllers/openapi.json /tmp/openapi.json || { echo "::error::Run: cd services/control-plane && uv run python -m devenv.openapi > ../../docs/controllers/openapi.json"; exit 1; }
      - name: Planning prompt copy is in sync
        run: diff -u docs/controllers/planning-prompt.md services/control-plane/devenv/planning_prompt.md
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: web build
        working-directory: services/web
        run: npm ci && npm run build

  images:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: control-plane, context: services/control-plane, target: "" }
          - { name: web, context: services/web, target: "" }
          - { name: worker-claude, context: workers, target: claude }
          - { name: worker-codex, context: workers, target: codex }
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: '[ -f "${{ matrix.image.context }}/Dockerfile" ] && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"'
      - if: steps.exists.outputs.yes == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.exists.outputs.yes == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.yes == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.exists.outputs.yes == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          target: ${{ matrix.image.target }}
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/gibovski/ai-devenv-claude/${{ matrix.image.name }}:latest
            ghcr.io/gibovski/ai-devenv-claude/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
