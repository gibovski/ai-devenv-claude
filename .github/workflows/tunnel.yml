# Creates or updates the Cloudflare Tunnel, DNS record and Access policies from GitHub.
# The VM's Apply button runs the same Terraform with the same R2 state, so either path works.
# Needs secret CLOUDFLARE_API_TOKEN and variables CF_ACCOUNT_ID, CF_ZONE, CF_HOSTNAME
# (optional CF_ACCESS_EMAILS as a JSON list).
name: tunnel
on:
  workflow_dispatch:
    inputs:
      command:
        description: plan, apply or destroy
        default: plan
        type: choice
        options: [plan, apply, destroy]
  push:
    branches: [main]
    paths: ["infra/terraform/cloudflare/**"]
permissions:
  contents: read
concurrency:
  group: tunnel
jobs:
  terraform:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_account_id: ${{ vars.CF_ACCOUNT_ID }}
      TF_VAR_zone: ${{ vars.CF_ZONE }}
      TF_VAR_hostname: ${{ vars.CF_HOSTNAME }}
      TF_VAR_allowed_emails: ${{ vars.CF_ACCESS_EMAILS || '[]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform ${{ inputs.command || 'plan' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$TF_VAR_hostname" ]; then
            echo "::notice::Set the CLOUDFLARE_API_TOKEN secret and CF_ACCOUNT_ID, CF_ZONE, CF_HOSTNAME variables to manage the tunnel from GitHub."
            exit 0
          fi
          infra/terraform/cloudflare/tf.sh "${{ inputs.command || 'plan' }}" -no-color
