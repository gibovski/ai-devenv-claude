# Builds the Ubuntu VM images for amd64 and arm64, smoke-tests them and publishes a release.
# Runs when something that goes into the image changes on main, once a month to pick up
# OS security patches, and on demand.
name: images
on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "stack/**"
      - "services/**"
      - "workers/**"
      - "mcp/**"
      - "infra/terraform/cloudflare/**"
      - ".github/workflows/images.yml"
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      arches:
        description: "JSON list of architectures"
        default: '["amd64","arm64"]'
      publish:
        description: "Publish a release"
        type: boolean
        default: true
      e2e:
        description: "Run the end-to-end task test on amd64 (needs E2E_* secrets)"
        type: boolean
        default: true
  pull_request:
    paths: ["images/**", ".github/workflows/images.yml"]
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: write
  packages: read
env:
  PACKER_VERSION: "1.11.2"
  PACKER_GITHUB_API_TOKEN: ${{ github.token }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: packer validate
        working-directory: images/packer
        run: |
          packer init .
          packer validate -var arch=amd64 .
          packer validate -var arch=arm64 -var accelerator=tcg .

  prepare:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      arches: ${{ steps.tag.outputs.arches }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHES: ${{ inputs.arches || '["amd64","arm64"]' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag=$base n=1
          while gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; do n=$((n+1)); tag="$base.$n"; done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "arches=$ARCHES" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ]; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "AI Dev Environment $tag" --notes "Daily build $tag from ${GITHUB_SHA::7}."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.arches) }}
    # Native arm64 runners (free on public repos) build the arm64 stack images without emulation.
    # Set the ARM64_RUNNER variable to override, e.g. to ubuntu-24.04 for a private repo.
    runs-on: ${{ matrix.arch == 'arm64' && (vars.ARM64_RUNNER || 'ubuntu-24.04-arm') || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      ARCH: ${{ matrix.arch }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          df -h /
      - name: Install QEMU and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm qemu-utils \
            qemu-efi-aarch64 ovmf cloud-image-utils genisoimage zstd zip jq gettext-base
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - name: Choose accelerator
        id: accel
        run: |
          host=$(uname -m); want=$([ "$ARCH" = arm64 ] && echo aarch64 || echo x86_64)
          if [ "$host" = "$want" ] && [ -w /dev/kvm ]; then echo "accel=kvm" >> "$GITHUB_OUTPUT"; else echo "accel=tcg" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build stack images for ${{ matrix.arch }}
        run: |
          if [ -x stack/build-images.sh ]; then
            stack/build-images.sh "linux/$ARCH" images/packer/images-cache "$TAG"
          fi
      - uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: Packer build
        working-directory: images/packer
        env:
          PACKER_LOG: "0"
        run: |
          packer init .
          packer build -color=false -var arch="$ARCH" -var accelerator=${{ steps.accel.outputs.accel }} \
            -var version="$TAG" -var cpus=4 .
          rm -rf images-cache/*.tar
      - name: Check the image holds no credentials or per-VM state
        # Images are shared with other people: credentials are only ever entered in the settings UI.
        env:
          SCAN_VALUES: |
            ${{ github.token }}
            ${{ secrets.E2E_GITHUB_TOKEN }}
            ${{ secrets.E2E_ANTHROPIC_API_KEY }}
            ${{ secrets.E2E_CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
            ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
            ${{ secrets.OPENAI_API_KEY }}
        run: images/scripts/scan-secrets.sh "images/packer/output-$ARCH/devenv-$TAG-$ARCH.qcow2"
      - name: Smoke test
        # Boots a throwaway overlay; the image file itself is never written to.
        run: images/scripts/smoke-test.sh "images/packer/output-$ARCH/devenv-$TAG-$ARCH.qcow2" "$ARCH"
      - name: Convert formats
        run: |
          out=dist base="devenv-$TAG-$ARCH"
          images/scripts/convert.sh "images/packer/output-$ARCH/$base.qcow2" "$out" "$base" "$ARCH"
          python3 images/scripts/sbom.py "images/packer/output-$ARCH/packages.tsv" "images/packer/output-$ARCH/images.txt" \
            "$out/$base.spdx.json" "$base"
          rm -rf "images/packer/output-$ARCH"
          images/scripts/split-large.sh "$out"
          mv "$out/SHA256SUMS" "$out/SHA256SUMS-$ARCH"
          [ -f "$out/SHA256SUMS.parts" ] && mv "$out/SHA256SUMS.parts" "$out/SHA256SUMS-$ARCH.parts"
          df -h /
      - name: Upload to release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
      # Only when not publishing: a published build's e2e job pulls the image from the draft release,
      # so the ~4 GB image never lands in Actions artifact storage (which is shared across every repo
      # on the account and was filling the quota, breaking other repos' deploys).
      - name: Keep the amd64 image for the end-to-end test
        if: matrix.arch == 'amd64' && needs.prepare.outputs.publish != 'true' && (github.event_name != 'workflow_dispatch' || inputs.e2e)
        uses: actions/upload-artifact@v4
        with:
          name: e2e-image
          path: dist/devenv-*-amd64.qcow2*
          retention-days: 1
          compression-level: 0

  # Test-only credentials live here, in a job that boots a throwaway copy of the already-built,
  # already-scanned image. They never reach the build job or any published file.
  e2e:
    needs: [prepare, build]
    if: (github.event_name != 'workflow_dispatch' || inputs.e2e) && contains(needs.prepare.outputs.arches, 'amd64') && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
      E2E_ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
      E2E_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_CODE_OAUTH_TOKEN }}
      E2E_REPO: ${{ vars.E2E_REPO || 'gibovski/devenv-e2e-claude' }}
      E2E_CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
      E2E_CF_ACCOUNT_ID: ${{ vars.E2E_CF_ACCOUNT_ID }}
    steps:
      - name: Check test credentials
        id: creds
        run: |
          if [ -n "$E2E_GITHUB_TOKEN" ] && [ -n "$E2E_CLAUDE_CODE_OAUTH_TOKEN$E2E_ANTHROPIC_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::End-to-end task test skipped: set E2E_GITHUB_TOKEN and E2E_CLAUDE_CODE_OAUTH_TOKEN"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - name: Download the image from the draft release
        if: steps.creds.outputs.ok == 'true' && needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "devenv-$TAG-amd64.qcow2*" -D e2e
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.ok == 'true' && needs.prepare.outputs.publish != 'true'
        with:
          name: e2e-image
          path: e2e
      - name: Install QEMU
        if: steps.creds.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf cloud-image-utils genisoimage jq
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Boot the image and run a task to a merged PR
        if: steps.creds.outputs.ok == 'true'
        run: |
          img="e2e/devenv-$TAG-amd64.qcow2"
          [ -f "$img" ] || cat "$img".part* > "$img"
          E2E_HOOK="$PWD/images/scripts/e2e-task.sh" images/scripts/smoke-test.sh "$img" amd64

  publish:
    needs: [prepare, build, e2e]
    if: needs.prepare.outputs.publish == 'true' && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Publish release and keep the last 7
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          # A failed end-to-end test keeps the release a draft; a skipped one (e2e off) does not.
          OK: ${{ needs.build.result == 'success' && needs.e2e.result != 'failure' && needs.e2e.result != 'cancelled' }}
        run: |
          if [ "$OK" != true ]; then
            echo "::warning::A build or the end-to-end test failed; release $TAG stays a draft."
            exit 0
          fi
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
          # Pruning is housekeeping: it must never fail the run. Draft releases have no git tag, so
          # --cleanup-tag 422s on them; fall back to deleting without it. </dev/null stops gh eating
          # the loop's input and skipping entries.
          prune() {
            echo "deleting $1"
            gh release delete "$1" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag </dev/null \
              || gh release delete "$1" -R "$GITHUB_REPOSITORY" --yes </dev/null \
              || echo "::warning::could not delete release $1"
          }
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,createdAt \
            --jq '[.[] | select(.isDraft | not)] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
          while read -r old; do prune "$old"; done
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,createdAt \
            --jq '[.[] | select(.isDraft)] | .[] | select(.createdAt < (now - 172800 | todate)) | .tagName' |
          while read -r old; do prune "$old"; done
