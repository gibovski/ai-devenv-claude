line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter owns line length

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[lint.isort]
known-first-party = ["devenv", "devenv_worker"]
